name: Aggiorna calendario Inter

on:
  # Ogni 30 minuti
  schedule:
    - cron: "0 3 * * *"
  # Permette di lanciarla a mano dalla scheda Actions
  workflow_dispatch:

# Permette all'azione di fare commit sul repository
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: pip install requests

      - name: Genera calendar.json
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: python fetch_inter_matches.py

      - name: Commit e push (se il file è cambiato)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add calendar.json logos/
          # Se non c'è nulla da committare, non far fallire l'azione
          git diff --cached --quiet || git commit -m "🤖 Aggiorna calendario e loghi"
          git push

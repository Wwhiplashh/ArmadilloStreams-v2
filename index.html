<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prossimi eventi sportivi</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">

    <!-- =====================================================
         HERO MULTI-EVENTO (prossime 48 ore)
         ===================================================== -->
    <section id="hero" class="hero" hidden>
      <h1 class="hero-title">Prossimi eventi</h1>
      <div id="hero-list" class="hero-list"></div>
    </section>

    <!-- =====================================================
         STATO DI CARICAMENTO
         ===================================================== -->
    <div id="stato" class="stato">
      <div class="spinner"></div>
      <p>Caricamento...</p>
    </div>

    <!-- =====================================================
         SEZIONE INTER
         ===================================================== -->
    <section id="sezione-inter" class="sezione" hidden>
      <h2 class="sezione-title">
        <span class="dot inter-dot"></span> Inter
      </h2>
      <div id="card-inter" class="card"></div>
    </section>

    <!-- =====================================================
         SEZIONE FORMULA 1
         ===================================================== -->
    <section id="sezione-f1" class="sezione" hidden>
      <h2 class="sezione-title">
        <span class="dot f1-dot"></span> Formula 1
      </h2>
      <div id="card-f1" class="card"></div>
    </section>

    <!-- =====================================================
         ERRORE
         ===================================================== -->
    <div id="errore" class="errore" hidden>
      <p>😕 Impossibile caricare gli eventi.</p>
      <p id="errore-dettaglio"></p>
    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prossimi eventi sportivi</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">

    <!-- Stato di caricamento -->
    <div id="stato" class="stato">
      <div class="spinner"></div>
      <p>Caricamento...</p>
    </div>

    <!-- Griglia con le due card -->
    <div id="griglia" class="griglia-eventi" hidden>

      <section id="sezione-inter" class="sezione">
        <div id="card-inter" class="card"></div>
      </section>

      <section id="sezione-f1" class="sezione">
        <div id="card-f1" class="card"></div>
      </section>

    </div>

    <!-- Errore -->
    <div id="errore" class="errore" hidden>
      <p>😕 Impossibile caricare gli eventi.</p>
      <p id="errore-dettaglio"></p>
    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>
